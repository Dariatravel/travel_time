# Проверить, до каких чатов бот реально достучится.
#
# Зачем: когда оповещение не уходит, в журнале видно только «чат ***: chat not
# found» — сам id GitHub затирает как секрет, и понять, какая именно запись в
# TELEGRAM_MANAGER_CHAT_IDS испортилась, невозможно. «chat not found» одинаково
# отвечает на три РАЗНЫЕ беды:
#   1) в секрете лежит не id, а ссылка, @логин или опечатка;
#   2) id обычной группы устарел — группу повысили до супергруппы, id сменился;
#   3) id верный, но именно ЭТОТ бот в чат не добавлен.
# Проверка различает все три и называет бота, которого надо добавить.
#
# Репозиторий публичный, журналы видны всем — поэтому сюда нельзя передавать
# переменные с номерами чатов: блок env GitHub печатает В НАЧАЛЕ шага, раньше
# любого ::add-mask::. Проверке хватает двух секретов — их GitHub затирает сам.
# В вывод не печатается ни один id: только названия чатов и имя бота, то есть
# то, что видит любой собеседник в Telegram.
#
# Только читает: ничего никуда не отправляет.
name: Telegram Chat Check

on:
  workflow_dispatch:

jobs:
  check:
    name: Check manager chats
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Ask Telegram about each configured chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MANAGER_CHAT_IDS: ${{ secrets.TELEGRAM_MANAGER_CHAT_IDS }}
        run: |
          set -euo pipefail
          python3 scripts/telegram-chat-check.py
