name: Backup Supabase (encrypted)

# Ежедневная резервная копия РАБОЧЕЙ базы шахматки.
#
# Репозиторий публичный, поэтому дамп никогда не лежит в открытом виде:
# он шифруется ключом age, закрытая половина которого есть только на Mac mini
# (~/.config/rental-ai/backup-age.key). Зашифрованный файл сохраняется как
# артефакт запуска на 30 дней; Mac mini каждое утро забирает свежий и
# расшифровывает в ~/backups/supabase/ (apps/server/scripts/fetch_supabase_backup.sh
# в репозитории rental-ai). Рабочая база при этом только читается.
#
# Что внутри дампа: схемы public, app_private, auth (учётные записи) и storage
# (опись файлов), формат pg_dump -Fc — восстанавливать через pg_restore,
# можно выборочно по таблицам.
#
# Кроме дампа в архив кладутся (14.09.2026, по внешнему ревью):
#   * фотографии из хранилища Supabase — их в дампе базы НЕТ, в базе только
#     опись; без них восстановленная шахматка останется без картинок;
#   * права на таблицы и функции — дамп снимается с --no-privileges, потому
#     что иначе восстановление спотыкается о чужие ALTER DEFAULT PRIVILEGES.
#
# Ключ расшифровки. AGE_RECIPIENT — Mac mini. Если задан секрет
# AGE_RECIPIENT_2 (вторая копия ключа у Дарьи), архив шифруется на оба:
# потеря Mac mini тогда не превращает все копии в мусор.

on:
  schedule:
    - cron: "30 2 * * *"   # 05:30 по Москве
  workflow_dispatch:

concurrency:
  group: backup-supabase
  cancel-in-progress: false

env:
  # Публичная половина ключа age с Mac mini. Расшифровать может только закрытая.
  AGE_RECIPIENT: age1gsmfudtmxpklhp5e7qtrq68dsptg397dydjw3lhy3jwl8kwcxs5sfvqwnq

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 age >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          age --version

      - name: Dump production database (read-only)
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$PROD_DB_URL"
          stamp="$(date -u +%Y-%m-%d)"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          pg_dump "$PROD_DB_URL" -Fc --no-owner --no-privileges \
            --schema=public --schema=app_private --schema=auth --schema=storage \
            -f "travel_time-$stamp.pgc"
          # Проверка, что дамп читается и в нём есть таблица броней.
          pg_restore --list "travel_time-$stamp.pgc" | grep -q 'TABLE DATA public reserves'
          echo "dump size: $(du -h "travel_time-$stamp.pgc" | cut -f1)"

      - name: Save grants (dump is taken without privileges)
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Права не попадают в дамп, а без них восстановленная база либо
          # закрыта для приложения, либо открыта лишнему. Снимаем отдельно.
          #
          # Сначала REVOKE: защита здесь построена на том, что у функций
          # отнято право у PUBLIC. Без этих строк восстановленная база была бы
          # РАЗРЕШИТЕЛЬНЕЕ рабочей — функции вроде oko_merge_clients_unchecked
          # оказались бы доступны любому вошедшему.
          psql "$PROD_DB_URL" -At -o "privileges-$STAMP.sql" -c "
            SELECT 'REVOKE ALL ON FUNCTION ' || p.oid::regprocedure || ' FROM PUBLIC;'
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname IN ('public','app_private')
               AND p.proacl IS NOT NULL
               AND NOT EXISTS (
                   SELECT 1 FROM aclexplode(p.proacl) AS a
                    WHERE a.grantee = 0 AND a.privilege_type = 'EXECUTE')
             ORDER BY 1;"
          psql "$PROD_DB_URL" -At -c "
            SELECT 'GRANT ' || string_agg(DISTINCT privilege_type, ', ')
                   || ' ON TABLE ' || quote_ident(table_schema) || '.' || quote_ident(table_name)
                   || ' TO ' || quote_ident(grantee) || ';'
              FROM information_schema.role_table_grants
             WHERE table_schema IN ('public','app_private')
               AND grantee IN ('anon','authenticated','service_role')
             GROUP BY table_schema, table_name, grantee
             ORDER BY 1;" >> "privileges-$STAMP.sql"
          psql "$PROD_DB_URL" -At -c "
            SELECT 'GRANT EXECUTE ON FUNCTION ' || p.oid::regprocedure || ' TO ' || quote_ident(g.grantee) || ';'
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) AS a
              JOIN pg_roles g ON g.oid = a.grantee
             WHERE n.nspname IN ('public','app_private')
               AND a.privilege_type = 'EXECUTE'
               AND g.rolname IN ('anon','authenticated','service_role')
             ORDER BY 1;" >> "privileges-$STAMP.sql"
          echo "grants: $(wc -l < "privileges-$STAMP.sql") строк"

      - name: Encrypt database backup
        env:
          AGE_RECIPIENT_2: ${{ secrets.AGE_RECIPIENT_2 }}
        run: |
          set -euo pipefail
          # Второй получатель — запасной ключ вне Mac mini. Не задан — шифруем
          # на один, но это известный риск: потеря Mac mini = потеря всех копий.
          recipients=(-r "$AGE_RECIPIENT")
          if [ -n "${AGE_RECIPIENT_2:-}" ]; then
            recipients+=(-r "$AGE_RECIPIENT_2")
            echo "шифруем на два ключа"
          else
            echo "ВНИМАНИЕ: запасной ключ (AGE_RECIPIENT_2) не задан"
          fi
          echo "RECIPIENTS_OK=1" >> "$GITHUB_ENV"
          tar -czf "travel_time-$STAMP.bundle.tar" \
            "travel_time-$STAMP.pgc" "privileges-$STAMP.sql"
          age "${recipients[@]}" -o "travel_time-$STAMP.pgc.age" "travel_time-$STAMP.bundle.tar"
          shred -u "travel_time-$STAMP.pgc" "travel_time-$STAMP.bundle.tar"
          echo "encrypted size: $(du -h "travel_time-$STAMP.pgc.age" | cut -f1)"

      # База уезжает в артефакт ДО фотографий: сколько бы их ни качалось и чем
      # бы это ни кончилось, копия базы за сегодня уже сохранена.
      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.STAMP }}
          path: travel_time-${{ env.STAMP }}.pgc.age
          retention-days: 30
          if-no-files-found: error

      - name: Download storage files (photos are not in the database dump)
        # Свой запас времени и continue-on-error: фотографии не должны
        # утащить за собой копию базы, она уже уехала артефактом выше.
        continue-on-error: true
        timeout-minutes: 40
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p storage-files
          # Опись объектов берём из базы: так не нужен обход по страницам.
          # Отдельно узнаём, сколько их всего, чтобы пустой список из-за
          # ошибки прав нельзя было принять за «фотографий нет».
          expected="$(psql "$PROD_DB_URL" -At -c 'SELECT count(*) FROM storage.objects')"
          psql "$PROD_DB_URL" -At -F '/' -c \
            "SELECT bucket_id, name FROM storage.objects ORDER BY bucket_id, name" > objects.txt
          total=$(wc -l < objects.txt)
          echo "объектов в хранилище: $total (по счётчику $expected)"
          test "$total" = "$expected"

          # Качаем параллельно: последовательно тысячи файлов не успеют.
          # Путь кодируем: имена с пробелами и кириллицей иначе не скачать.
          cat > fetch.sh <<'SH'
          set -u
          path="$1"
          [ -z "$path" ] && exit 0
          bucket="${path%%/*}"; key="${path#*/}"
          enc="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$key")"
          target="storage-files/$path"
          mkdir -p "$(dirname "$target")"
          if curl -fsS -m 60 -H "Authorization: Bearer $SERVICE_KEY" \
               "$SUPABASE_URL/storage/v1/object/$bucket/$enc" -o "$target"; then
            exit 0
          fi
          echo "$path" >> storage-errors.txt
          exit 0
          SH
          chmod +x fetch.sh
          export SERVICE_KEY SUPABASE_URL
          tr -d '\r' < objects.txt | xargs -P 8 -I{} bash fetch.sh "{}"

          failed=$( [ -f storage-errors.txt ] && wc -l < storage-errors.txt || echo 0 )
          downloaded=$((total - failed))
          echo "скачано: $downloaded из $total, не вышло: $failed"
          {
            echo "$downloaded из $total объектов, не скачано $failed"
            cat objects.txt
          } > "storage-manifest-$STAMP.txt"
          tar -czf "storage-$STAMP.tgz" storage-files "storage-manifest-$STAMP.txt" \
            $( [ -f storage-errors.txt ] && echo storage-errors.txt )
          echo "storage size: $(du -h "storage-$STAMP.tgz" | cut -f1)"
          # Хоть один непрочитанный файл — шаг красный, чтобы это было видно.
          test "$failed" = "0"

      - name: Encrypt and upload storage archive
        if: always() && hashFiles(format('storage-{0}.tgz', env.STAMP)) != ''
        continue-on-error: true
        env:
          AGE_RECIPIENT_2: ${{ secrets.AGE_RECIPIENT_2 }}
        run: |
          set -euo pipefail
          recipients=(-r "$AGE_RECIPIENT")
          [ -n "${AGE_RECIPIENT_2:-}" ] && recipients+=(-r "$AGE_RECIPIENT_2")
          age "${recipients[@]}" -o "storage-$STAMP.tgz.age" "storage-$STAMP.tgz"
          shred -u "storage-$STAMP.tgz"

      - name: Upload storage artifact
        if: always() && hashFiles(format('storage-{0}.tgz.age', env.STAMP)) != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: supabase-storage-${{ env.STAMP }}
          path: storage-${{ env.STAMP }}.tgz.age
          retention-days: 30
          if-no-files-found: warn
