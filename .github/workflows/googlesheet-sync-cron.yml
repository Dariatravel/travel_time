name: Google Sheet Occupancy Cron

on:
  schedule:
    - cron: '0 * * * *'   # каждый час
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet gspread google-auth openpyxl
      - name: Sync Google-sheet occupancy
        env:
          GOOGLE_SA_B64: ${{ secrets.GOOGLE_SA_B64 }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/googlesheet-cron-sync.py
