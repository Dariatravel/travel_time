name: Deploy Yandex Cloud Mirror

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  YC_CLOUD_ID: b1g43dk01a0t2mt0aqhm
  YC_FOLDER_ID: b1gam66bh2jtelu9656g
  YC_REGISTRY_ID: crpf4seergfpqlkg7iih
  YC_CONTAINER_NAME: travel-time
  YC_API_GATEWAY_NAME: travel-time
  YC_SERVICE_ACCOUNT_ID: ajengmf1j6jbk729ut5q

jobs:
  deploy:
    name: Build and deploy mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Миграции должны завершиться до сборки и переключения контейнера: этот
      # релиз читает user_roles, поэтому образ без схемы запускать нельзя.
      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || {
            echo "::error::SUPABASE_DB_URL is required for an atomic schema and code deployment"
            exit 1
          }
          bash scripts/apply-release-migrations.sh

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud profile
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
        run: |
          printf '%s' "$YC_SA_JSON" > "$RUNNER_TEMP/yc-key.json"
          yc config profile create travel-time
          yc config set service-account-key "$RUNNER_TEMP/yc-key.json"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Login to Yandex Container Registry
        run: |
          yc iam create-token | docker login --username iam --password-stdin cr.yandex

      - name: Set image tag
        run: echo "IMAGE=cr.yandex/${YC_REGISTRY_ID}/travel-time:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # provenance и sbom обязательно выключены. С ними buildx кладёт в реестр
      # OCI-индекс вместо обычного образа, а Yandex Container Registry такой
      # формат не принимает и отвечает «Cannot read manifest data» на этапе
      # отправки. Из-за этого деплой падал молча с 16.08.2026: сборка проходила,
      # образ не уезжал, программа оставалась на старой версии.
      #
      # NEXT_PUBLIC_USE_YANDEX_BACKEND_PROXY=false — браузер обращается к
      # хранилищу напрямую, минуя контейнер.
      #
      # Почему: замеры 18.08 показали, что связь контейнера с хранилищем
      # работает через раз. Один и тот же запрос списка отелей — 0,2–0,5 с
      # напрямую и 25–30 с через контейнер, вплоть до обрыва по времени.
      # Менеджеры видели это как вечную загрузку без ошибки.
      #
      # Проверено 18.08: хранилище открывается напрямую из браузера в Абхазии и
      # отвечает «No API key found» — то есть сеть доходит. Это была главная
      # неизвестность, ради которой посредник и держали.
      #
      # Значение зашивается в код страницы при сборке, поэтому оно указано и в
      # аргументах сборки, и в переменных контейнера ниже — менять надо оба.
      #
      # Откат: вернуть true в обоих местах и выкатить. Серверная часть
      # посредника остаётся включённой, поэтому откат — это два слова, без
      # правки кода.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_USE_YANDEX_BACKEND_PROXY=false

      # Внимание: yc разбирает --environment по запятым, поэтому значение
      # переменной с запятой внутри превращается в две переменные и деплой
      # падает. Так уже случилось с TELEGRAM_MANAGER_CHAT_IDS, когда группа
      # менеджеров стала супергруппой и в списке оказалось два id. Бот с тех пор
      # живёт в Supabase Edge Function, контейнеру этот список не нужен —
      # переменная убрана. Новые переменные с запятыми сюда добавлять нельзя.
      # Ресурсы подобраны по замеру 18.08.2026, а не на глаз. Тогда один и тот
      # же запрос списка отелей занимал 0,23 с напрямую в базу и 30 с через
      # программу — то есть упирался в предел ожидания. Причина: одно ядро
      # обслуживало до 16 запросов сразу, а браузер шахматки шлёт их пачкой,
      # потому что через программу идут все обращения к базе, включая вход.
      #
      # Два ядра дают запас на разбор и пересылку ответов. Ограничение в шесть
      # запросов на экземпляр важнее ядер: при шестнадцати очередь копилась
      # внутри одного экземпляра, теперь Yandex поднимает второй, вместо того
      # чтобы держать всех в очереди.
      #
      # Проверять после изменений воркфлоу App Probe: он печатает три замера
      # подряд и настройки контейнера.
      - name: Deploy serverless container revision
        run: |
          yc serverless container revision deploy \
            --container-name "$YC_CONTAINER_NAME" \
            --image "$IMAGE" \
            --service-account-id "$YC_SERVICE_ACCOUNT_ID" \
            --memory 2GB \
            --cores 2 \
            --execution-timeout 30s \
            --concurrency 6 \
            --environment "NODE_ENV=production,NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }},NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }},NEXT_PUBLIC_USE_YANDEX_BACKEND_PROXY=false,SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},REALTYCALENDAR_WEBHOOK_TOKEN=${{ secrets.REALTYCALENDAR_WEBHOOK_TOKEN }},GOOGLE_SA_B64=${{ secrets.GOOGLE_SA_B64 }},GITHUB_DISPATCH_TOKEN=${{ secrets.MIRROR_DISPATCH_TOKEN }},TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }},TRANSACTIONAL_ICAL_SYNC_ENABLED=${{ vars.TRANSACTIONAL_ICAL_SYNC_ENABLED || 'true' }},YANDEX_BACKEND_PROXY_ENABLED=true,YANDEX_BACKEND_PROXY_CACHE_TTL_MS=10000"

      - name: Create or update API Gateway
        run: |
          CONTAINER_ID="$(yc serverless container get "$YC_CONTAINER_NAME" --format json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).id))")"
          TMP_SPEC="$(mktemp)"

          CONTAINER_ID="$CONTAINER_ID" \
          SERVICE_ACCOUNT_ID="$YC_SERVICE_ACCOUNT_ID" \
          SPEC_TEMPLATE="deploy/yandex/api-gateway.yaml" \
          SPEC_OUTPUT="$TMP_SPEC" \
            node - <<'NODE'
          const fs = require('fs');

          const input = fs.readFileSync(process.env.SPEC_TEMPLATE, 'utf8');
          const output = input
            .replaceAll('${CONTAINER_ID}', process.env.CONTAINER_ID)
            .replaceAll('${SERVICE_ACCOUNT_ID}', process.env.SERVICE_ACCOUNT_ID);

          fs.writeFileSync(process.env.SPEC_OUTPUT, output);
          NODE

          if yc serverless api-gateway get "$YC_API_GATEWAY_NAME" >/dev/null 2>&1; then
            yc serverless api-gateway update "$YC_API_GATEWAY_NAME" --spec "$TMP_SPEC"
          else
            yc serverless api-gateway create "$YC_API_GATEWAY_NAME" --spec "$TMP_SPEC"
          fi
