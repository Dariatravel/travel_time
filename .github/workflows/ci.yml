# Проверка каждого pull request: линт + production-сборка.
# Не деплоит ничего — только не даёт сломанному коду попасть в main незамеченным.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Фиктивные значения только для сборки: страницы клиентские,
      # реальные ключи на этапе next build не нужны.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Edge Function shared data
        run: |
          node scripts/build-edge-shared.mjs
          git diff --exit-code -- supabase/functions/telegram-bot/_shared/chessmate.ts

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Telegram Edge Function
        run: |
          deno test --frozen --lock supabase/functions/telegram-bot/deno.lock \
            supabase/functions/telegram-bot/parseManagerQuery.test.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Проверки для скриптов из scripts/: vitest их не берёт, он смотрит
      # только src/. Без этого шага правило про даты в переносе занятости
      # ничем не удерживается — а оно уже один раз ломало крон Bnovo.
      - name: Test scripts
        run: |
          npm run short-links:test
          npm run bnovo:test

      - name: Build
        run: npm run build
