# Убрать объект из программы — двумя способами.
#
# «Скрыть» (mode = hide) — объект пропадает из поиска и подбора, но брони,
# номера и выручка остаются. Это правильный способ для отеля, с которым просто
# перестали работать. Обратимо: mode = unhide возвращает обратно.
#
# «Удалить» (mode = delete) — необратимо, только для задвоенных и пробных
# записей. Требует apply = true и контрольной фразы DELETE_HOTELS; объект с
# любой бронью не удаляется вообще.
#
# По умолчанию оба режима делают сухой прогон и ничего не трогают.
name: Delete Hotel

on:
  workflow_dispatch:
    inputs:
      hotel_titles:
        description: 'Названия объектов через запятую, точно как в программе'
        required: true
      mode:
        description: 'Что сделать: скрыть из подбора, вернуть обратно или удалить запись'
        required: false
        type: choice
        default: hide
        options:
          - hide
          - unhide
          - delete
      apply:
        description: 'Удалить (иначе только показать опись)'
        required: false
        type: boolean
        default: false
      confirmation:
        description: 'Для удаления: DELETE_HOTELS'
        required: false
        default: ''

jobs:
  delete:
    name: Delete hotel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ inputs.mode }}
          HOTEL_TITLES: ${{ inputs.hotel_titles }}
          HOTEL_TITLE: ${{ inputs.hotel_titles }}
          HIDDEN: ${{ inputs.mode != 'unhide' }}
          APPLY: ${{ inputs.apply }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "${MODE}" = "delete" ]; then
            node scripts/delete-hotel.mjs
          else
            node scripts/set-hotel-visibility.mjs
          fi
