name: Mirror Occupancy Cron

on:
  schedule:
    - cron: '30 */2 * * *'   # каждые 2 часа (Студио + Сан Амра + Нора)
  workflow_dispatch:

jobs:
  sync:
    name: Sync mirror occupancy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mirror sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRANSACTIONAL_ICAL_SYNC_ENABLED: ${{ vars.TRANSACTIONAL_ICAL_SYNC_ENABLED || 'true' }}
          TRANSACTIONAL_ICAL_MIN_RETAINED_RATIO: ${{ vars.TRANSACTIONAL_ICAL_MIN_RETAINED_RATIO || '0.5' }}
          TRANSACTIONAL_ICAL_CONFIRM_LARGE_DECREASE: ${{ vars.TRANSACTIONAL_ICAL_CONFIRM_LARGE_DECREASE || 'false' }}
        run: node scripts/mirror-cron-sync.mjs
