# Показывает id чатов, куда добавлен бот. Нужен один раз: чтобы вписать id чата
# менеджеров в секрет TELEGRAM_MANAGER_CHAT_IDS.
#
# Работает только пока НЕ включён вебхук (Telegram отдаёт очередь либо нам в
# вебхук, либо по запросу — но не одновременно). Порядок такой: сначала этот
# воркфлоу, потом telegram-set-webhook.
name: Telegram Chat IDs

on:
  workflow_dispatch:

jobs:
  chat-ids:
    name: Show chat ids
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read pending updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "Не задан секрет TELEGRAM_BOT_TOKEN"
            exit 1
          fi

          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" > me.json
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100" > updates.json

          node - <<'NODE'
          const fs = require('fs');
          const me = JSON.parse(fs.readFileSync('me.json', 'utf8'));

          if (me.ok) {
            console.log(`Бот: @${me.result.username}`);
            console.log(
              me.result.can_read_all_group_messages
                ? 'Режим приватности ВЫКЛЮЧЕН — бот видит все сообщения группы.'
                : 'Режим приватности ВКЛЮЧЁН — бот видит только сообщения, начинающиеся со «/», ' +
                  'обращения по @имени и ответы на свои сообщения. ' +
                  'Выключить: @BotFather → /setprivacy → выбрать бота → Disable, ' +
                  'затем УДАЛИТЬ бота из группы и добавить заново (в старых группах настройка ' +
                  'применяется только при повторном добавлении).',
            );
            console.log('');
          }

          const body = JSON.parse(fs.readFileSync('updates.json', 'utf8'));

          if (!body.ok) {
            console.log('Telegram ответил ошибкой:', body.description);
            if (String(body.description || '').includes('webhook')) {
              console.log('Похоже, вебхук уже включён — сначала выключите его (telegram-set-webhook, action=delete).');
            }
            process.exit(1);
          }

          const chats = new Map();
          for (const update of body.result) {
            const message =
              update.message || update.edited_message || update.channel_post || update.edited_channel_post;
            if (!message?.chat) continue;
            chats.set(message.chat.id, `${message.chat.title || message.chat.first_name || ''} (${message.chat.type})`);
          }

          if (!chats.size) {
            console.log('Сообщений в очереди нет.');
            console.log('Что сделать: написать в группе «/chatid» — такие сообщения бот получает');
            console.log('в любом случае, даже при включённом режиме приватности, — и запустить снова.');
            process.exit(0);
          }

          console.log('Чаты, где бот видит сообщения:');
          for (const [id, title] of chats) {
            console.log(`  ${id}  —  ${title}`);
          }
          NODE
