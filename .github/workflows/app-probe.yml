# Работает ли программа прямо сейчас.
#
# Зачем: когда менеджеры пишут «шахматка не грузится», нужно за минуту понять,
# где именно встало — в самой программе на Yandex Cloud или в хранилище
# Supabase, откуда браузер тянет список отелей. Раньше это выяснялось
# перепиской и догадками.
#
# Только читает: запрашивает страницу и делает тот же запрос списка отелей,
# что и выпадающий список в поиске. Ключи не печатает, в базу не пишет.
name: App Probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe app and storage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      YC_CLOUD_ID: b1g43dk01a0t2mt0aqhm
      YC_FOLDER_ID: b1gam66bh2jtelu9656g
      YC_API_GATEWAY_NAME: travel-time

    steps:
      # Установка yc нужна только для служебных сведений: адрес шлюза и
      # настройки контейнера. Дважды она зависала на скачивании, и проверка
      # обрывалась по времени, так и не дойдя до замеров. Замеры важнее —
      # поэтому эти шаги теперь не роняют проверку.
      - name: Install Yandex Cloud CLI
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud profile
        continue-on-error: true
        timeout-minutes: 3
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
        run: |
          printf '%s' "$YC_SA_JSON" > "$RUNNER_TEMP/yc-key.json"
          yc config profile create probe
          yc config set service-account-key "$RUNNER_TEMP/yc-key.json"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Probe program
        continue-on-error: true
        run: |
          set -uo pipefail

          echo "=== ПРОГРАММА (Yandex Cloud) ==="
          DOMAIN="$(yc serverless api-gateway get "$YC_API_GATEWAY_NAME" --format json \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("domain",""))')"

          if [ -z "$DOMAIN" ]; then
            echo "Адрес шлюза получить не удалось."
          else
            echo "Адрес: https://$DOMAIN"
            # Пути ровно те, что открывают менеджеры: главная и шахматка.
            # Адрес шахматки — /main/reservation (см. src/shared/config/routes.ts),
            # не /reservation: по короткому Next.js честно отвечает 404.
            for path in "/" "/main/reservation"; do
              OUT="$(curl -sS -o /dev/null -w '%{http_code} %{time_total}' --max-time 40 "https://$DOMAIN$path" || echo 'нет ответа')"
              echo "  $path -> $OUT"
            done
          fi

          echo ""
          echo "=== ПОСЛЕДНЯЯ ВЫКАТКА КОНТЕЙНЕРА ==="
          yc serverless container revision list --container-name travel-time --format json \
            | python3 -c 'import sys,json;rs=json.load(sys.stdin);r=rs[0] if rs else {};print("создана:", r.get("created_at","?"), "| образ:", r.get("image",{}).get("image_url","?"))'

      # Браузер менеджера ходит в Supabase не напрямую, а через саму программу:
      # NEXT_PUBLIC_USE_YANDEX_BACKEND_PROXY=true, адрес /api/yandex-backend/gateway
      # (см. src/shared/config/supabase.ts). Через него идёт и вход в систему.
      # Поэтому проверять надо именно эту цепочку и именно на рабочем домене,
      # а не адрес шлюза: менеджеры открывают abhazbereg.online.
      - name: Probe login chain through the program
        env:
          SITE: https://abhazbereg.online
        run: |
          set -uo pipefail

          echo "=== ВХОД И ДАННЫЕ ЧЕРЕЗ ПРОГРАММУ ($SITE) ==="

          echo "Страница входа:"
          curl -sS -o /dev/null -w '  /login -> %{http_code} %{time_total}\n' --max-time 45 "$SITE/login" \
            || echo '  /login -> нет ответа'

          echo "Служба входа (auth/v1/health):"
          curl -sS -o "$RUNNER_TEMP/health.json" -w '  -> %{http_code} %{time_total}\n' --max-time 45 \
            "$SITE/api/yandex-backend/gateway/auth/v1/health" || echo '  -> нет ответа'
          head -c 300 "$RUNNER_TEMP/health.json" 2>/dev/null || true
          echo ""

          # Заведомо несуществующая пара логин-пароль. Настоящие данные тут не
          # нужны и недопустимы: важно лишь, отвечает ли служба входа вообще.
          # Живая служба вернёт 400 «Invalid login credentials» — это успех
          # проверки. Молчание или 502 означают, что сломана цепочка.
          echo "Попытка входа с заведомо неверной парой:"
          curl -sS -o "$RUNNER_TEMP/login.json" -w '  -> %{http_code} %{time_total}\n' --max-time 45 \
            -X POST "$SITE/api/yandex-backend/gateway/auth/v1/token?grant_type=password" \
            -H 'content-type: application/json' \
            -d '{"email":"probe-not-a-real-user@example.invalid","password":"not-a-real-password"}' \
            || echo '  -> нет ответа'
          head -c 300 "$RUNNER_TEMP/login.json" 2>/dev/null || true
          echo ""

          echo "Список отелей через программу:"
          curl -sS -o "$RUNNER_TEMP/gw-hotels.json" -w '  -> %{http_code} %{time_total}\n' --max-time 45 \
            "$SITE/api/yandex-backend/gateway/rest/v1/hotels?select=id,title&is_search_visible=eq.true&order=title" \
            || echo '  -> нет ответа'
          head -c 300 "$RUNNER_TEMP/gw-hotels.json" 2>/dev/null || true
          echo ""

      # Замер скорости: те же запросы, что делает шахматка, по три раза.
      # Первый вызов включает пробуждение контейнера, дальше видно рабочее
      # время. Сравнение «через программу» и «напрямую» показывает, сколько
      # добавляет сама программа, а сколько — база.
      - name: Measure speed
        env:
          SITE: https://abhazbereg.online
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          # Печатаем два времени: до первого байта и полное. Если первое
          # маленькое, а второе упирается в предел — данные пришли сразу, но
          # соединение не закрылось. Это совсем другая поломка, чем «медленно».
          measure () {
            LABEL="$1"; shift
            printf '  %-40s' "$LABEL"
            for attempt in 1 2 3; do
              T="$(curl -sS -o /dev/null -w '%{time_starttransfer}/%{time_total}' --max-time 60 "$@" || echo 'сбой')"
              printf ' %s' "$T"
            done
            printf '\n'
          }

          echo "=== СКОРОСТЬ: до первого байта / всего, три замера ==="

          measure "страница шахматки" "$SITE/main/reservation"
          measure "список отелей через программу" \
            "$SITE/api/yandex-backend/gateway/rest/v1/hotels?select=id,title&is_search_visible=eq.true&order=title"
          measure "список отелей напрямую в базу" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/hotels?select=id,title&is_search_visible=eq.true&order=title"
          measure "номера с бронями напрямую в базу" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/rooms?select=id,title&limit=200"

          echo ""
          echo "=== НАСТРОЙКИ КОНТЕЙНЕРА ==="
          command -v yc >/dev/null 2>&1 || { echo "  yc не установлен — пропускаю"; exit 0; }
          yc serverless container revision list --container-name travel-time --format json \
            | python3 -c 'import sys,json;r=json.load(sys.stdin)[0];res=r.get("resources",{});print("ядер:",res.get("cores"),"| память:",res.get("memory"),"| одновременных запросов:",r.get("concurrency"),"| таймаут:",r.get("execution_timeout"))'

      - name: Probe storage
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          echo "=== ХРАНИЛИЩЕ (Supabase) ==="
          echo "Тот же запрос, что делает выпадающий список отелей в поиске."

          URL="${SUPABASE_URL}/rest/v1/hotels?select=id,title&is_search_visible=eq.true&order=title"
          OUT="$(curl -sS -o "$RUNNER_TEMP/hotels.json" -w '%{http_code} %{time_total}' --max-time 40 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "$URL" || echo 'нет ответа')"
          echo "  список отелей -> $OUT"

          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'hotels.json')
          try:
              data = json.load(open(path, encoding='utf-8'))
          except Exception as error:
              print(f'  разобрать ответ не удалось: {error}')
          else:
              if isinstance(data, list):
                  print(f'  отелей в ответе: {len(data)}')
              else:
                  print(f'  ответ не список: {str(data)[:200]}')
          PY
